<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办事项</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent; min-height: 100vh; display: flex;
    justify-content: center; padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-radius: 16px; padding: 24px 28px;
    width: 580px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border: 1px solid rgba(255,255,255,0.3);
  }
  h1 { font-size: 20px; font-weight: 600; color: #1a1a2e; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  h1 span { background: #e8e8f0; font-size: 12px; padding: 2px 10px; border-radius: 12px; color: #555; }
  .date-group { margin-bottom: 8px; }
  .date-header {
    font-size: 13px; font-weight: 600; color: #999; padding: 8px 0 4px;
    border-bottom: 1px solid #eee; margin-bottom: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .date-header .today { color: #6c5ce7; }
  .date-header .dot { width: 4px; height: 4px; border-radius: 50%; background: #ddd; }
  .todo-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid #f0f0f5;
    transition: opacity 0.2s;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-item input[type="checkbox"] {
    width: 20px; height: 20px; cursor: pointer;
    accent-color: #6c5ce7; flex-shrink: 0;
  }
  .todo-item .text {
    flex: 1; font-size: 15px; color: #2d2d44;
    word-break: break-word; user-select: none;
    cursor: pointer; padding: 2px 0;
  }
  .todo-item .text.done { text-decoration: line-through; color: #aaa; }
  .todo-item .dates { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .todo-item .entry-date, .todo-item .done-date {
    font-size: 11px; white-space: nowrap; flex-shrink: 0;
    background: #f5f5fa; padding: 2px 8px; border-radius: 4px;
    color: #999; min-width: 38px; text-align: center;
  }
  .todo-item .done-date { color: #6c5ce7; background: rgba(108,92,231,0.08); font-weight: 500; }
  .todo-item .deadline-date {
    font-size: 11px; white-space: nowrap; flex-shrink: 0;
    background: #f0f0f5; padding: 2px 8px; border-radius: 4px;
    color: #999; min-width: 38px; text-align: center;
  }
  .todo-item .deadline-date.urgent {
    color: #fff; background: #e74c3c; font-weight: 500;
  }
  .todo-item .delete {
    opacity: 0; cursor: pointer; font-size: 18px; color: #ccc;
    transition: opacity 0.2s; flex-shrink: 0; line-height: 1; padding: 0 4px;
  }
  .todo-item:hover .delete { opacity: 1; }
  .todo-item .delete:hover { color: #e74c3c; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-row input[type="text"] {
    flex: 1; min-width: 180px; padding: 10px 14px; border: 1px solid #e0e0e8;
    border-radius: 10px; font-size: 14px; outline: none;
    transition: border 0.2s;
  }
  .add-row input[type="text"]:focus { border-color: #6c5ce7; }
  .add-row input[type="date"] {
    padding: 9px 8px; border: 1px solid #e0e0e8;
    border-radius: 10px; font-size: 12px; outline: none; color: #666;
    transition: border 0.2s; flex-shrink: 0; width: 100%; box-sizing: border-box;
  }
  .add-row input[type="date"]:focus { border-color: #6c5ce7; }
  .date-field { display: flex; flex-direction: column; gap: 3px; align-items: center; flex-shrink: 0; }
  .date-label { font-size: 10px; color: #aaa; white-space: nowrap; }
  .add-row button {
    padding: 10px 18px; background: #6c5ce7; color: #fff;
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 500; align-self: flex-end;
    transition: background 0.2s;
  }
  .add-row button:hover { background: #5a4bd1; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 30px 0; }
  .stats { font-size: 12px; color: #aaa; text-align: right; margin-top: 12px; }
  .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .share-btn {
    background: none; border: 1px solid #e0e0e8; border-radius: 8px;
    padding: 5px 12px; font-size: 12px; color: #999; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; gap: 4px;
  }
  .share-btn:hover { border-color: #6c5ce7; color: #6c5ce7; background: rgba(108,92,231,0.05); }
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.35); justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px; padding: 24px 28px;
    width: auto; max-width: 440px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2); text-align: center;
  }
  .modal-box h2 { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 16px; }
  .modal-box .qrcode { margin: 0 auto 14px; display: flex; justify-content: center; }
  .modal-box .qrcode canvas { width: 180px; height: 180px; border-radius: 8px; }
  .modal-box .hint { font-size: 12px; color: #999; margin-bottom: 12px; }
  .modal-box textarea {
    width: 100%; min-height: 80px; max-height: 300px; padding: 10px; border: 1px solid #e0e0e8;
    border-radius: 10px; font-size: 13px; resize: vertical; outline: none;
    font-family: inherit; box-sizing: border-box; height: auto;
  }
  .modal-box .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
  .modal-box .modal-actions button {
    padding: 8px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; border: none; font-weight: 500;
  }
  .modal-box .btn-copy { background: #6c5ce7; color: #fff; }
  .modal-box .btn-copy:hover { background: #5a4bd1; }
  .modal-box .btn-close { background: #f0f0f5; color: #666; }
  .modal-box .btn-close:hover { background: #e0e0e8; }
  .cat-stage {
    position: relative; width: 100%; height: 68px;
    margin-bottom: 2px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(245,164,96,0.06) 0%, transparent 100%);
  }
  .cat-mover {
    position: absolute; top: 6px; width: 56px; height: 56px;
    right: 0;
  }
  .cat-mover svg { width: 56px; height: 56px; display: block; cursor: pointer; }
  .eyes-blink, .eyes-happy, .mouth-happy { display: none; }
  .speech-bubble {
    position: absolute; right: 60px; top: 48px; max-width: 340px;
    background: #fff; border: 1px solid #e0d5c8; border-radius: 14px;
    padding: 8px 16px; font-size: 13px; line-height: 1.5;
    color: #6c5ce7; font-family: 'Comic Sans MS', '华文彩云', 'STCaiyun', cursive;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); opacity: 0;
    pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap; transform: translateY(4px);
  }
  .speech-bubble.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .speech-bubble::after {
    content: ''; position: absolute; top: 14px; right: -7px;
    width: 10px; height: 10px; background: #fff;
    border-right: 1px solid #e0d5c8; border-top: 1px solid #e0d5c8;
    transform: rotate(45deg);
  }
  .toast {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    color: #fff; padding: 14px 28px; border-radius: 14px;
    font-size: 16px; font-weight: 500; z-index: 999;
    box-shadow: 0 8px 32px rgba(108,92,231,0.35);
    opacity: 0; pointer-events: none;
    animation: toastIn 0.4s ease forwards;
  }
  @keyframes toastIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.9); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  @keyframes toastOut {
    0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(0.9); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="cat-stage">
    <div class="cat-mover" id="catClick">
    <div class="speech-bubble" id="speechBubble"></div>
    <svg viewBox="0 0 100 100" style="display:block;">
      <g class="cat-body">
      <!-- body -->
      <ellipse cx="50" cy="62" rx="34" ry="32" fill="#fff" stroke="#e0d5c8" stroke-width="1.5"/>
      <!-- orange spots -->
      <ellipse cx="32" cy="52" rx="7" ry="6" fill="#f4a460" opacity="0.85"/>
      <ellipse cx="60" cy="70" rx="6" ry="5" fill="#f4a460" opacity="0.85"/>
      <ellipse cx="58" cy="44" rx="5" ry="4" fill="#f4a460" opacity="0.8"/>
      <ellipse cx="38" cy="78" rx="5" ry="4" fill="#f4a460" opacity="0.8"/>
      <ellipse cx="28" cy="70" rx="4" ry="3" fill="#f4a460" opacity="0.7"/>
      <!-- ears -->
      <polygon points="28,38 22,14 40,32" fill="#fff" stroke="#e0d5c8" stroke-width="1.5"/>
      <polygon points="72,38 78,14 60,32" fill="#fff" stroke="#e0d5c8" stroke-width="1.5"/>
      <!-- inner ears -->
      <polygon points="29,36 25,20 38,33" fill="#fce4d6"/>
      <polygon points="71,36 75,20 62,33" fill="#fce4d6"/>
      <!-- orange spot on left ear -->
      <ellipse cx="30" cy="28" rx="4" ry="3" fill="#f4a460" opacity="0.6"/>
      <g class="cat-head">
      <!-- face -->
      <circle cx="50" cy="48" r="22" fill="#fff" stroke="#e0d5c8" stroke-width="1.2"/>
      <!-- eyes - normal -->
      <g class="eyes-normal">
      <ellipse cx="40" cy="44" rx="4" ry="4.5" fill="#2d2d44"/>
      <ellipse cx="60" cy="44" rx="4" ry="4.5" fill="#2d2d44"/>
      <ellipse cx="41" cy="42" rx="1.5" ry="1.5" fill="#fff"/>
      <ellipse cx="61" cy="42" rx="1.5" ry="1.5" fill="#fff"/>
      </g>
      <!-- eyes - blink closed -->
      <g class="eyes-blink">
      <path d="M36 44 Q40 42 44 44" fill="none" stroke="#2d2d44" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M56 44 Q60 42 64 44" fill="none" stroke="#2d2d44" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <!-- eyes - happy squint -->
      <g class="eyes-happy">
      <path d="M36 43 Q40 40 44 43" fill="none" stroke="#2d2d44" stroke-width="2" stroke-linecap="round"/>
      <path d="M56 43 Q60 40 64 43" fill="none" stroke="#2d2d44" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- nose -->
      <ellipse cx="50" cy="51" rx="2.5" ry="2" fill="#ff9999"/>
      <!-- mouth normal -->
      <path class="mouth-normal" d="M45 54 Q50 58 55 54" fill="none" stroke="#bbb" stroke-width="1.2" stroke-linecap="round"/>
      <!-- mouth happy (smile) -->
      <path class="mouth-happy" d="M43 54 Q50 60 57 54" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
      <!-- cheeks -->
      <ellipse cx="34" cy="51" rx="4" ry="3" fill="#ffcccc" opacity="0.5"/>
      <ellipse cx="66" cy="51" rx="4" ry="3" fill="#ffcccc" opacity="0.5"/>
      <!-- whiskers left -->
      <line x1="38" y1="53" x2="18" y2="48" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
      <line x1="38" y1="55" x2="16" y2="58" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
      <!-- whiskers right -->
      <line x1="62" y1="53" x2="82" y2="48" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
      <line x1="62" y1="55" x2="84" y2="58" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
      </g>
      <!-- paws -->
      <g class="cat-paw-l"><ellipse cx="38" cy="90" rx="10" ry="5" fill="#fff" stroke="#e0d5c8" stroke-width="1.2"/>
      <ellipse cx="38" cy="90" rx="3" ry="2" fill="#ffcccc" opacity="0.6"/></g>
      <g class="cat-paw-r"><ellipse cx="62" cy="90" rx="10" ry="5" fill="#fff" stroke="#e0d5c8" stroke-width="1.2"/>
      <ellipse cx="62" cy="90" rx="3" ry="2" fill="#ffcccc" opacity="0.6"/></g>
      <!-- tail -->
      <g class="cat-tail"><path d="M82 68 Q96 62 92 50 Q88 38 80 42" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <path d="M82 68 Q96 62 92 50 Q88 38 80 42" fill="none" stroke="#e0d5c8" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="90" cy="52" rx="5" ry="3" fill="#f4a460" opacity="0.8"/></g>
      </g>
    </svg>
    </div>
  </div>
  <h1>待办事项 <span id="count">0</span></h1>
  <div id="list"></div>
  <div class="add-row">
    <input id="newInput" type="text" placeholder="输入新事项..." autofocus>
    <div class="date-field">
      <span class="date-label">录入日期</span>
      <input id="dateInput" type="date">
    </div>
    <div class="date-field">
      <span class="date-label">截止日期</span>
      <input id="deadlineInput" type="date">
    </div>
    <button id="addBtn">添加</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="footer-row">
    <div></div>
    <button class="share-btn" id="shareBtn">↗ 分享</button>
  </div>
</div>
<div class="modal-overlay" id="shareModal">
  <div class="modal-box">
    <h2>分享待办事项</h2>
    <div class="qrcode"><canvas id="qrCanvas"></canvas></div>
    <div class="hint">用微信扫码即可分享给好友</div>
    <textarea id="shareText" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-copy" id="copyBtn">复制文本</button>
      <button class="btn-close" id="closeModalBtn">关闭</button>
    </div>
  </div>
</div>
<script>
  const STORAGE_KEY = 'todo_list_desktop';
  const today = () => new Date().toISOString().slice(0, 10);
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]').map(t => ({
    text: t.text, done: !!t.done, date: t.date || today(),
    entryDate: t.entryDate || t.date || today(),
    doneDate: t.doneDate || null,
    deadline: t.deadline || null
  }));

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const statsEl = document.getElementById('stats');
  const inputEl = document.getElementById('newInput');
  const dateInput = document.getElementById('dateInput');
  const deadlineInput = document.getElementById('deadlineInput');
  const addBtn = document.getElementById('addBtn');

  dateInput.value = today();

  const compliments = [
    '太厉害了，这都搞定了！', '你就是效率天花板！', '又完成一件事，今天状态满分！',
    '不愧是你，行动力一流！', '完成任务的你，闪闪发光！', '好棒！离目标又近了一步 ✨',
    '你认真起来真好看 💫', '这效率，简直无敌了！', '不仅人美，做事也这么利索！',
    '今天的你也在发光呢 ✨', '太强了吧，又拿下一项！', '你这执行力，我直接跪了！',
    '美貌与实力并存啊 🌸', '你这效率，仙女都自愧不如！', '又美又能干，说的就是你！',
    '每天都被你的行动力惊艳到！', '这么好看还这么努力，还给别人活路吗 😍',
    '任务完成度+1，美貌值+100！', '你一定是被工作耽误的超模！',
    '又美又飒，说的就是你吧！', '你这效率，简直像开了挂！',
  ];
  let prevDone = new Set();

  function showToast(msg) {
    const old = document.querySelector('.toast');
    if (old) { old.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => old.remove(), 300); }
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => {
      el.style.animation = 'toastOut 0.3s ease forwards';
      setTimeout(() => el.remove(), 300);
    }, 2500);
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

  function fmtShortDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function fmtDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((today - d) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === -1) return '明天';
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const sameYear = d.getFullYear() === now.getFullYear();
    const parts = sameYear
      ? `${d.getMonth() + 1}月${d.getDate()}日`
      : `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    if (diff > 0 && diff < 7) return `${parts} 周${weekdays[d.getDay()]}`;
    return parts;
  }

  function render() {
    listEl.innerHTML = '';
    if (todos.length === 0) {
      listEl.innerHTML = '<div class="empty">还没有待办事项，添加一条吧</div>';
      countEl.textContent = '0';
      statsEl.textContent = '';
      return;
    }
    const done = todos.filter(t => t.done).length;
    countEl.textContent = `${done}/${todos.length}`;
    statsEl.textContent = done === todos.length && todos.length > 0 ? '全部完成 🎉' : `已完成 ${done} / 共 ${todos.length}`;

    const groupDates = list => {
      const g = {};
      list.forEach(t => { if (!g[t.date]) g[t.date] = []; g[t.date].push(t); });
      return Object.keys(g).sort((a, b) => b.localeCompare(a));
    };
    const pending = todos.filter(t => !t.done);
    const finished = todos.filter(t => t.done);

    [pending, finished].forEach(list => groupDates(list).forEach(dateStr => {
      const items = list.filter(t => t.date === dateStr);
      const groupDiv = document.createElement('div');
      groupDiv.className = 'date-group';
      const header = document.createElement('div');
      header.className = 'date-header';
      const label = fmtDate(dateStr);
      const isToday = dateStr === today();
      header.innerHTML = `<span${isToday ? ' class="today"' : ''}>${label}</span><span class="dot"></span><span>${items.length}</span>`;
      groupDiv.appendChild(header);
      items.forEach(t => {
        const i = todos.indexOf(t);
        const div = document.createElement('div');
        div.className = 'todo-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = t.done;
        cb.addEventListener('change', () => {
          const wasDone = t.done; t.done = cb.checked;
          if (t.done && !wasDone) { t.doneDate = today(); showToast(compliments[Math.floor(Math.random() * compliments.length)]); }
          else if (!t.done && wasDone) { t.doneDate = null; }
          save(); render();
        });
        const span = document.createElement('span');
        span.className = 'text' + (t.done ? ' done' : '');
        span.textContent = t.text;
        span.addEventListener('click', () => {
          const wasDone = t.done; t.done = !t.done;
          if (t.done && !wasDone) { t.doneDate = today(); showToast(compliments[Math.floor(Math.random() * compliments.length)]); }
          else if (!t.done && wasDone) { t.doneDate = null; }
          save(); render();
        });
        const datesDiv = document.createElement('div');
        datesDiv.className = 'dates';
        const entrySpan = document.createElement('span');
        entrySpan.className = 'entry-date';
        entrySpan.textContent = '录入 ' + fmtShortDate(t.entryDate);
        datesDiv.appendChild(entrySpan);
        if (t.doneDate) {
          const doneSpan = document.createElement('span');
          doneSpan.className = 'done-date';
          doneSpan.textContent = '完成 ' + fmtShortDate(t.doneDate);
          datesDiv.appendChild(doneSpan);
        }
        if (t.deadline) {
          const deadlineSpan = document.createElement('span');
          deadlineSpan.className = 'deadline-date';
          deadlineSpan.textContent = '期限 ' + fmtShortDate(t.deadline);
          const dl = new Date(t.deadline + 'T00:00:00');
          const now = new Date(today() + 'T00:00:00');
          const daysLeft = Math.round((dl - now) / 86400000);
          if (daysLeft <= 1 && !t.done) deadlineSpan.classList.add('urgent');
          datesDiv.appendChild(deadlineSpan);
        }
        const del = document.createElement('span');
        del.className = 'delete'; del.textContent = '✕';
        del.addEventListener('click', () => { todos.splice(i, 1); save(); render(); });
        div.appendChild(cb); div.appendChild(span); div.appendChild(datesDiv); div.appendChild(del);
        groupDiv.appendChild(div);
      });
      listEl.appendChild(groupDiv);
    }));
  }

  function addTodo() {
    const text = inputEl.value.trim();
    if (!text) return;
    const d = dateInput.value || today();
    todos.push({ text, done: false, date: d, entryDate: today(), doneDate: null, deadline: deadlineInput.value || null });
    inputEl.value = ''; dateInput.value = today(); deadlineInput.value = '';
    save(); render(); inputEl.focus();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  document.getElementById('shareBtn').addEventListener('click', () => {
    if (todos.length === 0) { showToast('还没有待办事项'); return; }
    const lines = ['📋 待办事项清单\n'];
    const groups = {};
    todos.forEach(t => { if (!groups[t.date]) groups[t.date] = []; groups[t.date].push(t); });
    Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(date => {
      lines.push(`\n【${fmtDate(date)}】`);
      groups[date].forEach(t => lines.push(`  ${t.done ? '✅' : '⬜'} ${t.text}${t.doneDate ? ' （完成于' + t.doneDate + '）' : ''}${t.deadline ? ' ⏰期限:' + t.deadline : ''}`));
    });
    const text = lines.join('\n');
    const textarea = document.getElementById('shareText');
    textarea.value = text;
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 300) + 'px';
    const canvas = document.getElementById('qrCanvas');
    QRCode.toCanvas(canvas, text, { width: 180, margin: 1 }, err => {
      if (err) showToast('二维码生成失败');
    });
    document.getElementById('shareModal').classList.add('show');
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = document.getElementById('shareText').value;
    try {
      await navigator.clipboard.writeText(text);
      showToast('已复制到剪贴板，粘贴到微信即可发送 📋');
    } catch { showToast('复制失败'); }
  });

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('shareModal').classList.remove('show');
  });
  document.getElementById('shareModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) document.getElementById('shareModal').classList.remove('show');
  });

  const quotes = [
    '你已经很棒了，今天也辛苦啦 🐱',
    '摸鱼是打工人的基本人权 🐾',
    '周五会来的，再坚持一下 ✊',
    '老板画饼，橘猫给你真鱼干 🐟',
    '工资到账那一刻，一切都值得 💰',
    '累了就歇会儿，我又不会跑 🥰',
    '今天的你也闪闪发光哦 ✨',
    '别太拼，房贷又不是你一个人的 🏠',
    '工位虽小，梦想很大 🌟',
    '开会时偷偷撸猫（就是我）😼',
    'KPI 是公司的，快乐是自己的 😌',
    '你认真工作的侧脸，比PPT好看 📊',
    '下班倒计时：还剩半天而已 🕐',
    '再难的任务，拆开来也就那样 💪',
    '这破班上得，不如来撸猫 🐈',
    '你已经比昨天的自己更好了 🌱',
    '别焦虑，天塌下来有高个顶着 🏗️',
    '橘猫认证：你是全公司最靓的仔 😎',
    '加什么班，回家陪猫不好吗 🏡',
    '你值得加薪！🐱（我说的）',
  ];
  let lastQuote = -1;

  document.getElementById('catClick').addEventListener('click', e => {
    const bubble = document.getElementById('speechBubble');
    let idx;
    do { idx = Math.floor(Math.random() * quotes.length); } while (idx === lastQuote);
    lastQuote = idx;
    bubble.textContent = quotes[idx];
    bubble.classList.toggle('show');
    e.stopPropagation();
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#catClick')) document.getElementById('speechBubble').classList.remove('show');
  });

  render();
</script>
</body>
</html>
